<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мелодика — музыкальные квизы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: студия телевикторины — глубокий кобальт, табло из золотых ламп, одна колонка по центру */
:root{
  --bg:#0d1450; --bg2:#141d6b; --panel:#1a2480; --line:#2c3a9e;
  --fg:#eef0ff; --muted:#9aa3e0; --gold:#ffc83d; --gold-ink:#2a1c00;
  --ok:#3ee0a0; --bad:#ff6b6b;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,#2a3bc4 0%,transparent 70%);
  background-attachment:fixed}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:900 22px/1 var(--display);letter-spacing:.02em;cursor:pointer;background:none;border:0;padding:0}
.eq{display:flex;align-items:flex-end;gap:3px;height:22px}
.eq i{display:block;width:5px;background:var(--gold);border-radius:2px;height:40%}
.eq i:nth-child(2){height:90%}.eq i:nth-child(3){height:60%}.eq i:nth-child(4){height:75%}
body.playing .eq i{animation:eq .9s ease-in-out infinite alternate}
body.playing .eq i:nth-child(2){animation-delay:-.3s}body.playing .eq i:nth-child(3){animation-delay:-.6s}body.playing .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{from{height:20%}to{height:100%}}

h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,6vw,46px);font-weight:900}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.label{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--bg2);
  border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;transition:transform .08s,background .15s;white-space:nowrap}
.btn:hover{background:var(--panel)}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.icon{width:36px;height:36px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

input[type=text],input[type=url],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 220px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}

/* home */
.hero{display:grid;gap:14px;margin-bottom:32px}
.hero p{max-width:60ch;margin:0;color:var(--muted)}
.quizlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.qcard{display:flex;flex-direction:column;gap:12px}
.qcard .covers{display:flex;height:56px}
.qcard .covers img,.qcard .covers span{width:56px;height:56px;border-radius:8px;object-fit:cover;border:2px solid var(--panel);margin-right:-14px;background:var(--bg2)}
.qcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

/* editor */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px}
.tab[aria-selected=true]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.results{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:380px;overflow:auto}
.track{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;background:var(--bg2)}
.track img,.track .ph{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none;background:var(--bg);display:grid;place-items:center;font-size:18px}
.track .meta{flex:1;min-width:0}
.track .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.track .meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:14px}
.badge{font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--bg);color:var(--muted);flex:none}
.badge.yandex{color:#ffdb4d}.badge.itunes{color:#ff8fb1}.badge.deezer{color:#b48cff}.badge.url,.badge.file{color:var(--ok)}
.badge.mat{background:var(--bad);color:#2a0000}.badge.clean{color:var(--ok)}.badge.unk{color:var(--muted)}
.qrow.flagged{box-shadow:inset 3px 0 0 var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg2);cursor:pointer;font-size:14px}
.chip:has(input:checked){border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg2))}
.prompt{font-size:clamp(20px,4vw,28px);max-width:30ch}
#roundTabs .tab{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.qrow{display:grid;grid-template-columns:28px 44px 1fr;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--bg2)}
.qrow .num{font:700 14px var(--mono);color:var(--gold);text-align:center}
.qrow .ctl{grid-column:3;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qrow .ctl select{width:auto;padding:6px 10px;font-size:14px}
.qrow .ctl input{width:84px;padding:6px 10px;font-size:14px}
.qrow img,.qrow .ph{width:44px;height:44px;border-radius:6px;object-fit:cover;background:var(--bg);display:grid;place-items:center}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.hint{font-size:14px;color:var(--muted);margin:0}
.note{font-size:14px;padding:12px 14px;border-radius:10px;background:var(--bg2);border-left:3px solid var(--gold);color:var(--muted)}

/* play */
.board{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.lamps{display:flex;gap:5px;flex-wrap:wrap}
.lamps i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.lamps i.done{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.lamps i.cur{background:var(--fg);box-shadow:0 0 10px var(--fg)}
.score{font:700 28px/1 var(--mono);color:var(--gold);font-variant-numeric:tabular-nums}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:20px;align-items:center}
.disc{width:150px;height:150px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle,#0a0f3a 0 2px,#151c5e 2px 4px);border:4px solid #0a0f3a;box-shadow:0 10px 30px #0006;display:grid;place-items:center}
.disc::after{content:"";width:46px;height:46px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 8px #e6a800}
.disc.spin{animation:spin 2.4s linear infinite}
.disc img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.disc.revealed::after{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.playbtn{width:84px;height:84px;border-radius:50%;font-size:30px;padding:0}
.timer{width:100%;max-width:520px;height:10px;border-radius:999px;background:var(--bg);overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);width:100%;transform-origin:left}
.tnum{font:700 18px var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:620px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font-weight:600;text-align:left;display:flex;gap:10px;align-items:center;min-height:58px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt kbd{font:700 13px var(--mono);color:var(--gold);flex:none}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--bg2))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--bg2))}
.opt:disabled{cursor:default}
.answer{display:flex;flex-direction:column;gap:4px}
.answer .big{font:700 clamp(20px,4vw,28px)/1.2 var(--display)}
.verdict{font:900 18px var(--display);letter-spacing:.04em}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--bad)}
.ymbox{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;margin:0 auto}
.ymwrap{--hx:12%;--hy:50%;--hr:36px;position:relative;width:100%;border-radius:12px;overflow:hidden;touch-action:none}
.ymwrap iframe{width:100%;height:244px;border:0;display:block}
/* вуаль размывает плеер; круглое окошко оставляет видимой кнопку ▶, клики проходят насквозь */
.ymveil{position:absolute;inset:0;pointer-events:none;display:none;
  background:color-mix(in srgb,var(--bg) 40%,transparent);
  -webkit-backdrop-filter:blur(12px) saturate(.6);backdrop-filter:blur(12px) saturate(.6);
  -webkit-mask:radial-gradient(circle var(--hr) at var(--hx) var(--hy),transparent calc(100% - 1px),#000 100%);
  mask:radial-gradient(circle var(--hr) at var(--hx) var(--hy),transparent calc(100% - 1px),#000 100%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.ymveil{background:var(--bg2)}}
.ymwrap.masked .ymveil{display:block}
.ymring{position:absolute;left:var(--hx);top:var(--hy);width:calc(var(--hr) * 2);height:calc(var(--hr) * 2);transform:translate(-50%,-50%);
  border:2px dashed var(--gold);border-radius:50%;pointer-events:none;display:none}
.ymadj{position:absolute;inset:0;display:none;cursor:crosshair}
.ymwrap.adjust .ymring,.ymwrap.adjust .ymadj{display:block}
.ymtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;font-size:14px}
.ymtools input[type=range]{width:140px;accent-color:var(--gold)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}
.team{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center}
.team .pts{font:700 26px var(--mono);color:var(--gold)}
.team .row{justify-content:center}
.final{display:flex;flex-direction:column;gap:10px;width:100%;max-width:480px}
.final .line{display:flex;justify-content:space-between;padding:12px 16px;border-radius:12px;background:var(--bg2);font-weight:600}
.final .line:first-child{background:var(--gold);color:var(--gold-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:#05082acc;display:grid;place-items:center;z-index:40;padding:16px}
.modal .card{max-width:520px;width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="logo" id="goHome" aria-label="На главную"><span class="eq"><i></i><i></i><i></i><i></i></span>Мелодика</button>
    <div class="row" id="topActions"></div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="card stack" id="modalBody"></div></div>

<script>
"use strict";
// исходник страницы до отрисовки — из него собирается скачиваемая файл-игра
const PAGE_SRC = "<!doctype html>\n" + document.documentElement.outerHTML
  .replace(/<script id="melodika-preset">[\s\S]*?<\/script>/, "");
/* ================= утилиты ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

function jsonp(url, cbParam = "callback") {
  return new Promise((resolve, reject) => {
    const cb = "jp_" + uid();
    const s = document.createElement("script");
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); reject(new Error("Источник не ответил за 10 секунд")); }, 10000);
    window[cb] = d => { done(); resolve(d); };
    s.onerror = () => { done(); reject(new Error("Источник недоступен из вашей сети")); };
    s.src = url + (url.includes("?") ? "&" : "?") + cbParam + "=" + cb;
    document.head.appendChild(s);
  });
}

/* ================= хранилище ================= */
const LS_KEY = "melodika.quizzes.v1";
function loadQuizzes() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch { return null; } }
function saveQuizzes() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.quizzes)); } catch { toast("Не удалось сохранить: память браузера недоступна"); } }

// IndexedDB для загруженных аудиофайлов
const idb = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("melodika-files", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("files");
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(key, blob) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(blob, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
  async get(key) { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction("files").objectStore("files").get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async del(key) { const db = await this.open(); db.transaction("files", "readwrite").objectStore("files").delete(key); }
};

/* ================= источники музыки ================= */
const SOURCES = {
  itunes: {
    name: "Apple / iTunes",
    async search(q, country) {
      const d = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&entity=song&limit=15&country=${country}`);
      return (d.results || []).filter(r => r.previewUrl).map(r => ({
        source: "itunes", ref: String(r.trackId), artist: r.artistName, title: r.trackName,
        cover: (r.artworkUrl100 || "").replace("100x100", "300x300"), preview: r.previewUrl, country,
        explicit: r.trackExplicitness === "explicit"
      }));
    },
    async resolve(q) {
      if (q.ref) {
        const d = await jsonp(`https://itunes.apple.com/lookup?id=${q.ref}&country=${q.country || "US"}`);
        const r = d.results && d.results[0];
        if (r && r.previewUrl) return r.previewUrl;
      }
      // запасной путь: найти по исполнителю и названию
      const found = await this.search(`${q.artist} ${q.title}`, q.country || "US");
      if (!found.length) throw new Error("Трек не найден в iTunes");
      Object.assign(q, { ref: found[0].ref, cover: q.cover || found[0].cover });
      saveQuizzes();
      return found[0].preview;
    }
  },
  deezer: {
    name: "Deezer",
    async search(q) {
      const d = await jsonp(`https://api.deezer.com/search?q=${encodeURIComponent(q)}&limit=15&output=jsonp`);
      if (d.error) throw new Error(d.error.message || "Ошибка Deezer");
      return (d.data || []).filter(r => r.preview).map(r => ({
        source: "deezer", ref: String(r.id), artist: r.artist?.name, title: r.title,
        cover: r.album?.cover_medium || "", preview: r.preview, explicit: !!r.explicit_lyrics
      }));
    },
    async resolve(q) {
      // ссылки превью Deezer подписаны и устаревают, поэтому берём свежую
      const d = await jsonp(`https://api.deezer.com/track/${q.ref}?output=jsonp`);
      if (!d.preview) throw new Error("Deezer не отдал превью этого трека");
      return d.preview;
    }
  },
  url: { async resolve(q) { return q.ref; } },
  file: {
    async resolve(q) {
      const blob = await idb.get(q.ref);
      if (!blob) throw new Error("Файл не найден в этом браузере. Загрузите его заново в редакторе.");
      return URL.createObjectURL(blob);
    }
  }
};

// старый формат виджета (#track/ТРЕК/АЛЬБОМ) переводим в текущий (/iframe/album/АЛЬБОМ/track/ТРЕК)
function ymSrc(ref) {
  const m = String(ref).match(/iframe\/#track\/(\d+)\/(\d+)/);
  return m ? `https://music.yandex.ru/iframe/album/${m[2]}/track/${m[1]}` : ref;
}
function ymPage(ref) {
  const m = String(ref).match(/album\/(\d+)\/track\/(\d+)/);
  return m ? `https://music.yandex.ru/album/${m[1]}/track/${m[2]}` : "https://music.yandex.ru/";
}
const YM_ALLOW = "autoplay; encrypted-media; clipboard-write";
// окошко над кнопкой ▶: положение в процентах и радиус в пикселях, общее для всех треков
function ymHole() {
  try { const h = JSON.parse(localStorage.getItem("melodika.ymHole")); if (h && isFinite(h.x)) return h; } catch {}
  return { x: 12, y: 50, r: 36 };
}
function ymMarkup(src, id = "") {
  return `<div class="ymbox" ${id ? `id="${id}"` : ""}>
    <div class="ymwrap masked">
      <iframe src="${esc(src)}" allow="${YM_ALLOW}" title="Плеер Яндекс Музыки"></iframe>
      <div class="ymveil"></div><div class="ymring"></div><div class="ymadj" title="Нажмите или проведите, чтобы поставить окошко над кнопкой ▶"></div>
    </div>
    <div class="ymtools">
      <button type="button" class="btn sm" data-ym="blur">Показать плеер</button>
      <button type="button" class="btn sm ghost" data-ym="adjust">Настроить окошко</button>
      <label class="row" style="gap:6px" data-ym="size" hidden>Размер <input type="range" min="16" max="90" step="1" aria-label="Размер окошка"></label>
      <span class="muted" data-ym="hint" hidden>Поставьте круг на кнопку ▶</span>
    </div>
  </div>`;
}
function bindYm(box) {
  if (!box || box.dataset.bound) return;
  box.dataset.bound = "1";
  const wrap = box.querySelector(".ymwrap"), adj = box.querySelector(".ymadj");
  const bBlur = box.querySelector('[data-ym="blur"]'), bAdj = box.querySelector('[data-ym="adjust"]');
  const size = box.querySelector('[data-ym="size"]'), range = size.querySelector("input"), hint = box.querySelector('[data-ym="hint"]');
  let h = ymHole();
  const apply = () => { wrap.style.setProperty("--hx", h.x + "%"); wrap.style.setProperty("--hy", h.y + "%"); wrap.style.setProperty("--hr", h.r + "px"); range.value = h.r; };
  const save = () => { try { localStorage.setItem("melodika.ymHole", JSON.stringify(h)); } catch {} };
  const syncBtns = () => {
    bBlur.textContent = wrap.classList.contains("masked") ? "Показать плеер" : "Размыть плеер";
    const on = wrap.classList.contains("adjust");
    bAdj.textContent = on ? "Готово" : "Настроить окошко";
    size.hidden = hint.hidden = !on;
  };
  box.syncYm = syncBtns;
  apply(); syncBtns();
  bBlur.onclick = () => { wrap.classList.toggle("masked"); if (!wrap.classList.contains("masked")) wrap.classList.remove("adjust"); syncBtns(); };
  bAdj.onclick = () => {
    const on = !wrap.classList.contains("adjust");
    wrap.classList.toggle("adjust", on);
    if (on) wrap.classList.add("masked"); else save();
    syncBtns();
  };
  range.oninput = () => { h.r = +range.value; apply(); save(); };
  let dragging = false;
  const place = e => {
    const b = wrap.getBoundingClientRect();
    h.x = Math.round(Math.min(100, Math.max(0, (e.clientX - b.left) / b.width * 100)) * 10) / 10;
    h.y = Math.round(Math.min(100, Math.max(0, (e.clientY - b.top) / b.height * 100)) * 10) / 10;
    apply();
  };
  adj.onpointerdown = e => { dragging = true; adj.setPointerCapture?.(e.pointerId); place(e); };
  adj.onpointermove = e => { if (dragging) place(e); };
  adj.onpointerup = adj.onpointercancel = () => { dragging = false; save(); };
}
// Яндекс Музыка: из ссылки или HTML-кода виджета получаем адрес плеера
function parseYandex(input) {
  input = input.trim();
  const src = input.match(/src=["']([^"']+)["']/i);
  if (src && /music\.yandex\./.test(src[1])) return src[1].startsWith("//") ? "https:" + src[1] : src[1];
  let m = input.match(/music\.yandex\.[a-z]+\/album\/(\d+)\/track\/(\d+)/i);
  if (m) return `https://music.yandex.ru/iframe/album/${m[1]}/track/${m[2]}`;
  m = input.match(/music\.yandex\.[a-z]+\/track\/(\d+)/i);
  if (m) return `https://music.yandex.ru/iframe/#track/${m[1]}`;
  m = input.match(/music\.yandex\.[a-z]+\/iframe\/[^\s"']+/i);
  if (m) return "https://" + m[0];
  return null;
}

/* ================= модель квиза ================= */
const ASK = { track: "Исполнитель — название", artist: "Исполнитель", title: "Название", custom: "Свой вопрос" };
const isCustomQ = q => q.ask === "custom" || q.source === "none";
function answerOf(q) {
  if (isCustomQ(q)) return q.answer || "?";
  if (q.ask === "artist") return q.artist || "?";
  if (q.ask === "title") return q.title || "?";
  return [q.artist, q.title].filter(Boolean).join(" — ") || "?";
}
function questionText(q) {
  if (q.prompt) return q.prompt;
  return "Угадайте: " + (ASK[q.ask] || ASK.track).toLowerCase();
}
function optionsFor(quiz, q, n = 4) {
  const right = answerOf(q);
  const ok = a => a && a !== "?" && a.toLowerCase() !== right.toLowerCase();
  const custom = isCustomQ(q);
  const decoys = (q.decoys || []).map(s => String(s).trim()).filter(ok);
  let pool = [];
  // для своих вопросов с заданными вариантами чужие ответы не подмешиваем
  if (!custom || !decoys.length) {
    const fits = x => x !== q && (custom ? isCustomQ(x) : x.source !== "none");
    const val = x => custom ? (x.answer || "") : answerOf({ ...x, ask: q.ask });
    const uniq = list => shuffle([...new Set(list.map(val).filter(ok))]);
    const same = uniq(quiz.questions.filter(x => fits(x) && x.round === q.round));
    const other = custom ? [] : uniq(quiz.questions.filter(x => fits(x) && x.round !== q.round));
    pool = [...same, ...other];
  }
  const wrong = [...new Set([...shuffle(decoys), ...pool])].slice(0, n - 1);
  if (!wrong.length) return null; // не из чего делать варианты — отвечают вслух
  return shuffle([right, ...wrong]);
}

function newRound(qz, title) {
  return { id: uid(), title: title || `Раунд ${(qz.rounds?.length || 0) + 1}`, desc: "", fragment: qz.fragment || 15, timer: qz.timer || 20, points: 1 };
}
// приводит любой квиз (в том числе старый, без раундов) к текущему формату
function ensureRounds(qz) {
  if (!Array.isArray(qz.questions)) qz.questions = [];
  if (!Array.isArray(qz.rounds) || !qz.rounds.length) qz.rounds = [newRound({ ...qz, rounds: [] }, "Раунд 1")];
  const ids = new Set(qz.rounds.map(r => r.id));
  qz.questions.forEach(q => { if (!ids.has(q.round)) q.round = qz.rounds[0].id; });
  if (!Array.isArray(qz.filter)) qz.filter = qz.clean === "rude" ? ["mat", "rude"] : qz.clean === "mat" ? ["mat"] : [];
  delete qz.clean;
  return qz;
}
function roundOf(qz, q) { return qz.rounds.find(r => r.id === q.round) || qz.rounds[0]; }
function roundQs(qz, r) { return qz.questions.filter(q => q.round === r.id); }

function plural(n, a, b, c) { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; }

function importQuiz(data) {

function encodeQuiz(qz) {
  const slim = { title: qz.title, fragment: qz.fragment, timer: qz.timer, rounds: qz.rounds, filter: qz.filter,
    questions: qz.questions.filter(q => q.source !== "file").map(({ id, mat, ...q }) => q) };
  const bytes = new TextEncoder().encode(JSON.stringify(slim));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeQuiz(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

    const finish = () => { qz.rounds = qz.rounds.filter(r => r !== cur); activeRound[qz.id] = other.id; saveQuizzes(); closeModal(); renderRounds(qz); renderQList(qz); };
    $("#rdNo").onclick = closeModal;
    if ($("#rdMove")) $("#rdMove").onclick = () => { roundQs(qz, cur).forEach(q => q.round = other.id); finish(); };
    $("#rdAll").onclick = () => {
      roundQs(qz, cur).forEach(q => { if (q.source === "file") idb.del(q.ref).catch(() => {}); });
      qz.questions = qz.questions.filter(q => q.round !== cur.id); finish();
    };
  };
  $("#addTitle").textContent = `Добавить в «${cur.title || "раунд"}»`;
}

function renderFilterBox(qz) {
  const box = $("#filterBox"); if (!box) return;
  const f = qz.filter || [];
  box.innerHTML = `
    <div class="row" style="justify-content:space-between"><h2>Фильтр содержания</h2><button class="btn sm" id="fCheck">Проверить песни</button></div>
    <p class="hint">Отметьте, чего не должно быть в песнях. Сайт найдёт текст каждой песни и уберёт те, где это есть, а потом покажет, что удалил и почему. Новые песни с такими темами не добавятся.</p>
    <div class="chips">${Object.entries(CATS).map(([k, c]) => `<label class="chip"><input type="checkbox" data-c="${k}" ${f.includes(k) ? "checked" : ""}> ${c.label}</label>`).join("")}</div>
    <div class="row"><button class="btn sm ghost" id="fKids">Для детей: отметить всё</button></div>`;
  const hasSongs = () => qz.questions.some(q => q.source !== "none");

async function addQuestion(qz, t) {
  const cats = qz.filter || [];
  if (cats.length && t.source !== "none") {
    toast("Проверяем текст песни…");
    const r = await checkTrack(t, cats);
    if (r.status === "explicit") { toast(`Не добавили «${t.title}»: ${r.reasons.join("; ")}`); return false; }
  }
  qz.questions.push({ id: uid(), ask: t.source === "none" ? "custom" : "track", start: 0, ...t, round: curRound(qz).id });
  saveQuizzes(); renderQList(qz); renderRounds(qz);
  toast(t.source === "none" ? "Вопрос добавлен" : `Добавлено: ${[t.artist, t.title].filter(Boolean).join(" — ")}`);
  return true;
}

function trackRow(t, actionsHtml) {
  return `<div class="track">${t.cover ? `<img src="${esc(t.cover)}" alt="" loading="lazy">` : `<span class="ph">♪</span>`}

    ${t.explicit ? `<span class="badge mat" title="Explicit: в каталоге отмечено, что есть ненормативная лексика">E</span>` : ""}<span class="badge ${t.source}">${t.source}</span>${actionsHtml}</div>`;
}

function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function renderQList(qz) {
  const list = $("#qList"); if (!list) return;
  const cur = curRound(qz), qs = roundQs(qz, cur);
  $("#qCount").textContent = qs.length ? `${qs.length} ${plural(qs.length, "вопрос", "вопроса", "вопросов")}` : "";
  if (!qs.length) { list.innerHTML = `<div class="empty">В этом раунде пока нет вопросов. Найдите трек выше или откройте вкладку «Свой вопрос». Для вариантов ответа нужно хотя бы 4 трека.</div>`; return; }
  list.innerHTML = "";
  const swap = (a, b) => { const ia = qz.questions.indexOf(a), ib = qz.questions.indexOf(b); qz.questions[ia] = b; qz.questions[ib] = a; saveQuizzes(); renderQList(qz); };
  qs.forEach((q, i) => {
    const audioQ = q.source !== "none", custom = isCustomQ(q);
    const head = custom ? (q.prompt || "Свой вопрос") : (q.title || "Без названия");
    const track = [q.artist, q.title].filter(Boolean).join(" — ");
    const sub = custom ? `Ответ: ${q.answer || "не задан"}${audioQ && track ? " · " + track : ""}` : `${q.artist || "—"}${q.prompt ? " · «" + q.prompt + "»" : ""}`;
    const el = document.createElement("div");
    el.className = "qrow" + (q.mat?.status === "explicit" ? " flagged" : "");
    el.innerHTML = `
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      ${q.cover ? `<img src="${esc(q.cover)}" alt="">` : `<span class="ph">${audioQ ? "♪" : "?"}</span>`}
      <div class="meta" style="min-width:0">
        <div class="row" style="gap:6px;flex-wrap:nowrap"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(head)}</b>${audioQ ? `<span class="badge ${q.source}">${q.source}</span>` : `<span class="badge">текст</span>`}${matBadge(q)}</div>
        <div class="muted" style="font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</div>
      </div>
      <div class="ctl">
        ${audioQ ? `<select aria-label="Что спрашиваем" data-k="ask">${Object.entries(ASK).map(([k, v]) => `<option value="${k}" ${q.ask === k ? "selected" : ""}>${k === "custom" ? "Свой вопрос" : "Угадать: " + v.toLowerCase()}</option>`).join("")}</select>` : ""}
        ${audioQ && q.source !== "yandex" ? `<label class="row" style="gap:6px;font-size:14px" title="С какой секунды начинать фрагмент">с&nbsp;<input type="number" min="0" max="600" step="1" value="${q.start || 0}" data-k="start" aria-label="Старт, секунды">&nbsp;с</label>
        <button class="btn icon" title="Прослушать фрагмент" data-a="prev">▶</button>` : ""}
        ${qz.rounds.length > 1 ? `<select aria-label="Перенести в раунд" data-k="round">${qz.rounds.map((r, k) => `<option value="${r.id}" ${r.id === q.round ? "selected" : ""}>Раунд ${k + 1}</option>`).join("")}</select>` : ""}
        <button class="btn icon" title="Вопрос и ответы" data-a="edit">✎</button>
        <button class="btn icon" title="Выше" data-a="up" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="btn icon" title="Ниже" data-a="down" ${i === qs.length - 1 ? "disabled" : ""}>↓</button>
        <button class="btn icon" title="Удалить" data-a="del" style="color:var(--bad)">✕</button>
      </div>`;
    const askSel = el.querySelector('[data-k=ask]');
    if (askSel) askSel.onchange = e => {
      q.ask = e.target.value; saveQuizzes();
      if (q.ask === "custom" && !q.answer) editQuestionModal(qz, q); else renderQList(qz);
    };
    const st = el.querySelector('[data-k=start]'); if (st) st.onchange = e => { q.start = Math.max(0, +e.target.value || 0); saveQuizzes(); };
    const rs = el.querySelector('[data-k=round]'); if (rs) rs.onchange = e => { q.round = e.target.value; saveQuizzes(); renderQList(qz); renderRounds(qz); toast("Вопрос перенесён"); };
    const pv = el.querySelector('[data-a=prev]');
    if (pv) pv.onclick = async ev => {
      const btn = ev.currentTarget;
      if (btn.textContent === "■") return previewToggle(null, btn);
      try { const src = await SOURCES[q.source].resolve(q); previewToggle(src, btn, q.start || 0, roundOf(qz, q).fragment); }
      catch (err) { toast(err.message); }
    };
    el.querySelector('[data-a=edit]').onclick = () => editQuestionModal(qz, q);
    el.querySelector('[data-a=up]').onclick = () => swap(q, qs[i - 1]);
    el.querySelector('[data-a=down]').onclick = () => swap(q, qs[i + 1]);
    el.querySelector('[data-a=del]').onclick = () => {
      if (q.source === "file") idb.del(q.ref).catch(() => {});
      qz.questions = qz.questions.filter(x => x !== q); saveQuizzes(); renderQList(qz); renderRounds(qz);
    };
    list.appendChild(el);
  });
}

function matBadge(q) {
  if (!q.mat || q.source === "none") return "";
  if (q.mat.status === "explicit") {
    const names = (q.mat.cats || []).map(c => c === "explicit" ? "explicit" : CATS[c]?.short || c);
    return `<span class="badge mat" title="${esc(q.mat.reasons.join("; "))}">${esc([...new Set(names)].slice(0, 2).join(", ") || "18+")}</span>`;
  }
  if (q.mat.status === "clean") return `<span class="badge clean" title="Текст проверен, ничего запрещённого нет">чисто</span>`;
  return `<span class="badge unk" title="Текст песни не найден — проверить не удалось">?</span>`;
}

// проверяет все песни квиза; autoRemove — сразу убрать найденные и сообщить, какие удалены
async function runMatCheck(qz, autoRemove) {
  const cats = (qz.filter || []).length ? qz.filter : Object.keys(CATS);
  const items = qz.questions.filter(q => q.source !== "none");
  if (!items.length) return toast("В квизе нет песен для проверки");
  openModal(`<h2>Проверяем тексты песен</h2>
    <p class="hint">Ищем: ${esc(cats.map(c => CATS[c].label.toLowerCase()).join(", "))}.</p>
    <div class="timer"><i id="mcBar" style="transform:scaleX(0)"></i></div>
    <p class="hint" id="mcStatus">Ищем тексты песен…</p>`);
  let done = 0;
  await pool(items, 4, async q => {
    await checkTrack(q, cats);
    done++;
    $("#mcBar") && ($("#mcBar").style.transform = `scaleX(${done / items.length})`);
    $("#mcStatus") && ($("#mcStatus").textContent = `Проверено ${done} из ${items.length}`);
  });
  const bad = items.filter(q => q.mat?.status === "explicit");
  const unk = items.filter(q => q.mat?.status === "unknown");
  const unkHtml = unk.length ? `<details class="note"><summary style="cursor:pointer">Не удалось проверить: ${unk.length}</summary><div class="stack" style="gap:4px;margin-top:8px;font-size:14px">${unk.map(q => matLine(q)).join("")}</div>
      <p class="hint" style="margin-top:8px">Текстов этих песен нет в открытой базе. Послушайте их сами или удалите вручную.</p></details>` : "";
  const removeBad = () => {
    bad.forEach(q => { if (q.source === "file") idb.del(q.ref).catch(() => {}); });
    qz.questions = qz.questions.filter(q => !bad.includes(q));
  };
  if (autoRemove && bad.length) removeBad();
  saveQuizzes(); renderQList(qz); renderRounds(qz);
  const list = `<div class="stack" style="gap:6px;font-size:14px;max-height:280px;overflow:auto">${bad.map(q => matLine(q)).join("")}</div>`;
  if (!bad.length) {
    openModal(`<h2>Ничего запрещённого не нашли</h2><p class="hint">Проверено песен: ${items.length}. Тексты найдены для ${items.length - unk.length}.</p>${unkHtml}
      <div class="row"><button class="btn gold" id="mcOk">Хорошо</button></div>`);
  } else if (autoRemove) {
    openModal(`<h2>Удалили ${bad.length} ${plural(bad.length, "песню", "песни", "песен")}</h2>
      <p class="hint">В квизе включён фильтр содержания, поэтому эти песни убраны:</p>${list}${unkHtml}
      <div class="row"><button class="btn gold" id="mcOk">Понятно</button></div>`);
  } else {
    openModal(`<h2>Нашли запрещённое в ${bad.length} ${plural(bad.length, "песне", "песнях", "песнях")}</h2>${list}${unkHtml}
      <div class="row"><button class="btn" id="mcDel" style="background:var(--bad);border-color:var(--bad);color:#200">Удалить эти песни</button><button class="btn ghost" id="mcOk">Оставить и пометить</button></div>`);
    $("#mcDel").onclick = () => { removeBad(); saveQuizzes(); renderQList(qz); renderRounds(qz); closeModal(); toast(`Удалено песен: ${bad.length}`); };
  }
  $("#mcOk").onclick = closeModal;
}

function editQuestionModal(qz, q) {
  const audioQ = q.source !== "none";
  openModal(`
    <h2>${audioQ ? "Вопрос к треку" : "Свой вопрос"}</h2>
    <form class="stack" id="eaForm">
      ${audioQ ? `<label class="field"><span class="label">Что спрашиваем</span><select id="eaAsk">${Object.entries(ASK).map(([k, v]) => `<option value="${k}" ${q.ask === k ? "selected" : ""}>${k === "custom" ? "Свой вопрос и свой ответ" : "Угадать: " + v.toLowerCase()}</option>`).join("")}</select></label>` : ""}
      <label class="field"><span class="label">Текст вопроса</span><textarea id="eaP" rows="2">${esc(q.prompt || "")}</textarea></label>
      <label class="field" id="eaAnsF"><span class="label">Правильный ответ</span><input type="text" id="eaAns" value="${esc(q.answer || "")}"></label>
      ${audioQ ? `<div class="row">
        <label class="field grow"><span class="label">Исполнитель</span><input type="text" id="eaA" value="${esc(q.artist)}"></label>
        <label class="field grow"><span class="label">Название</span><input type="text" id="eaT" value="${esc(q.title)}"></label></div>` : ""}
      <div class="field"><span class="label">Неверные варианты</span>
        <div class="stack" style="gap:6px">${[0, 1, 2].map(i => `<input type="text" class="eaD" aria-label="Неверный вариант ${i + 1}" value="${esc((q.decoys || [])[i] || "")}" placeholder="Вариант ${i + 2}">`).join("")}</div>
        <p class="hint" id="eaDHint"></p></div>
      <label class="field"><span class="label">Комментарий после ответа</span><input type="text" id="eaN" value="${esc(q.note || "")}" placeholder="Необязательно: интересный факт, покажется вместе с ответом"></label>
      <div class="row"><button class="btn gold">Сохранить</button><button type="button" class="btn ghost" id="eaC">Отмена</button></div>
    </form>`);
  const askNow = () => audioQ ? $("#eaAsk").value : "custom";
  const sync = () => {
    const ask = askNow();
    $("#eaAnsF").hidden = ask !== "custom";
    $("#eaP").placeholder = ask === "custom" ? "Например: «Из какого фильма эта песня?»" : `Необязательно. Если пусто: «Угадайте: ${ASK[ask].toLowerCase()}»`;
    $("#eaDHint").textContent = ask === "custom"
      ? "Если оставить пустыми, варианты возьмутся из ответов других своих вопросов этого раунда, а если их нет — отвечают вслух."
      : "Если оставить пустыми, варианты возьмутся из других треков квиза.";
  };
  if (audioQ) $("#eaAsk").onchange = sync;
  sync();
  $("#eaC").onclick = closeModal;
  $("#eaForm").onsubmit = e => {
    e.preventDefault();
    const ask = askNow(), prompt = $("#eaP").value.trim(), answer = $("#eaAns").value.trim();
    if (ask === "custom" && !answer) return toast("Укажите правильный ответ");
    if (!audioQ && !prompt) return toast("Напишите текст вопроса");
    q.ask = ask; q.prompt = prompt; q.answer = answer;
    if (audioQ) { q.artist = $("#eaA").value.trim(); q.title = $("#eaT").value.trim(); }
    q.decoys = [...document.querySelectorAll(".eaD")].map(x => x.value.trim()).filter(Boolean);
    q.note = $("#eaN").value.trim();
    saveQuizzes(); closeModal(); renderQList(qz);
  };
}

let previewBtn = null;
function previewToggle(src, btn, start = 0, len = 0) {
  if (previewBtn) previewBtn.textContent = "▶";
  if (!src || previewBtn === btn && !audio.paused) { stopAudio(); previewBtn = null; return; }
  playFragment(src, start, len || 30).then(() => { previewBtn = btn; btn.textContent = "■"; })
    .catch(err => toast(err.message));
  audio.onpause = () => { if (previewBtn) previewBtn.textContent = "▶"; previewBtn = null; document.body.classList.remove("playing"); };
}

function playFragment(src, start, len) {
  stopAudio();
  return new Promise((resolve, reject) => {
    audio.src = src;
    const onMeta = () => {
      audio.removeEventListener("loadedmetadata", onMeta);
      const dur = isFinite(audio.duration) ? audio.duration : 0;
      audio.currentTime = dur && start >= dur - 1 ? 0 : start;
      audio.play().then(() => {
        document.body.classList.add("playing");
        stopT = setTimeout(stopAudio, len * 1000);
        resolve();
      }).catch(() => reject(new Error("Браузер не дал включить звук. Нажмите ещё раз.")));
    };
    audio.addEventListener("loadedmetadata", onMeta);
    audio.onerror = () => reject(new Error("Не удалось загрузить аудио. Ссылка недоступна или формат не поддерживается."));
    audio.load();
  });
}

/* ================= настройка игры ================= */
function renderSetup() {
  const qz = quizById(state.editId); if (!qz) return go("home");
  ensureRounds(qz);
  const prev = state.lastSetup || { mode: "solo", teams: ["Красные", "Синие"], shuffle: true };
  const used = qz.rounds.filter(r => roundQs(qz, r).length);
  const app = $("#app");
  app.innerHTML = `
  <div class="stack">
    <span class="label">${used.length} ${plural(used.length, "раунд", "раунда", "раундов")} · ${qz.questions.length} ${plural(qz.questions.length, "вопрос", "вопроса", "вопросов")}</span>
    <h1>${esc(qz.title)}</h1>
    <div class="stack" style="gap:6px">${used.map((r, i) => `<div class="row" style="gap:10px"><span class="badge" style="font-size:12px">${i + 1}</span><b>${esc(r.title)}</b><span class="muted">${roundQs(qz, r).length} ${plural(roundQs(qz, r).length, "вопрос", "вопроса", "вопросов")}${r.points > 1 ? ` · очки ×${r.points}` : ""}</span></div>`).join("")}</div>
    <div class="settings">
      <button class="card stack" data-mode="solo" style="text-align:left;cursor:pointer">
        <h3>Сам за себя</h3><p class="hint">Варианты ответа, очки за скорость. Подходит, чтобы проверить себя.</p></button>
      <button class="card stack" data-mode="host" style="text-align:left;cursor:pointer">
        <h3>С ведущим и командами</h3><p class="hint">Ведущий включает трек на большом экране, команды отвечают вслух, ведущий начисляет баллы.</p></button>
    </div>
    <div id="teamBox" class="card stack" hidden>
      <span class="label">Команды</span>
      <div class="stack" id="teamList" style="gap:8px"></div>
      <button class="btn sm" id="addTeam" style="align-self:flex-start">+ Команда</button>
    </div>
    <label class="row" style="gap:8px"><input type="checkbox" id="shuf" ${prev.shuffle ? "checked" : ""}> Перемешать вопросы внутри раундов</label>
    <div class="row"><button class="btn gold" id="start">Начать игру</button><button class="btn ghost" id="back">К редактору</button></div>
  </div>`;
  let mode = prev.mode, teams = prev.teams.slice();
  const paint = () => {
    app.querySelectorAll("[data-mode]").forEach(b => b.style.borderColor = b.dataset.mode === mode ? "var(--gold)" : "var(--line)");
    $("#teamBox").hidden = mode !== "host";
    $("#teamList").innerHTML = teams.map((t, i) => `<div class="row"><input class="grow" type="text" value="${esc(t)}" data-i="${i}" aria-label="Команда ${i + 1}">${teams.length > 1 ? `<button class="btn icon" data-rm="${i}" title="Убрать">✕</button>` : ""}</div>`).join("");
    $("#teamList").querySelectorAll("input").forEach(inp => inp.oninput = () => teams[+inp.dataset.i] = inp.value);
    $("#teamList").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { teams.splice(+b.dataset.rm, 1); paint(); });
  };
  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; paint(); });
  $("#addTeam").onclick = () => { teams.push("Команда " + (teams.length + 1)); paint(); };
  $("#back").onclick = () => go("edit", { editId: qz.id });
  $("#start").onclick = () => {
    const sh = $("#shuf").checked;
    teams = teams.map((t, i) => t.trim() || "Команда " + (i + 1));
    state.lastSetup = { mode, teams, shuffle: sh };
    const order = qz.rounds.flatMap(r => { const qs = roundQs(qz, r); return sh ? shuffle(qs) : qs; });
    if (!order.length) return toast("В квизе нет вопросов");
    state.game = { quiz: qz, mode, order, i: 0, score: 0, correct: 0, teams: teams.map(n => ({ name: n, pts: 0 })), phase: "intro" };
    go("play");
  };
  paint();
}

/* ================= игра ================= */
function scoreLines(g) {
  return g.teams.slice().sort((a, b) => b.pts - a.pts)
    .map(t => `<div class="line"><span>${esc(t.name)}</span><span style="font-family:var(--mono)">${t.pts}</span></div>`).join("");
}
function renderPlay() {
  const g = state.game; if (!g) return go("home");
  const qz = g.quiz;
  $("#topActions").innerHTML = `<button class="btn sm ghost" id="quit">Выйти</button>`;
  $("#quit").onclick = () => go("home");
  if (g.i >= g.order.length) return renderFinal();
  const q = g.order[g.i], R = roundOf(qz, q);
  const usedRounds = [...new Set(g.order.map(x => x.round))];
  const roundNo = usedRounds.indexOf(R.id) + 1;
  const inRound = g.order.filter(x => x.round === R.id);
  const app = $("#app");

  // заставка раунда
  if (g.phase === "intro") {
    g.skeletonFor = null; clearInterval(g.tick); document.onkeydown = null;
    const hasAudio = inRound.some(x => x.source !== "none");
    const chips = [`${inRound.length} ${plural(inRound.length, "вопрос", "вопроса", "вопросов")}`, hasAudio ? `фрагмент ${R.fragment} с` : "", `${R.timer} с на ответ`, R.points > 1 ? `очки ×${R.points}` : ""].filter(Boolean);
    app.innerHTML = `<section class="stage">
      <span class="label">Раунд ${roundNo} из ${usedRounds.length}</span>
      <h1>${esc(R.title || "Раунд " + roundNo)}</h1>
      ${R.desc ? `<p class="muted" style="margin:0;max-width:52ch">${esc(R.desc)}</p>` : ""}
      <div class="row" style="justify-content:center;gap:8px">${chips.map(t => `<span class="badge" style="font-size:12px;padding:6px 10px">${t}</span>`).join("")}</div>
      ${g.mode === "host" && g.i > 0 ? `<div class="final">${scoreLines(g)}</div>` : ""}
      ${g.mode === "solo" && g.i > 0 ? `<div><span class="label">Очки</span><div class="score">${g.score}</div></div>` : ""}
      <button class="btn gold" id="startR">Начать раунд</button></section>`;
    $("#startR").onclick = () => { g.phase = "ready"; render(); };
    return;
  }

  const opts = g.opts && g.optsFor === q.id ? g.opts : (g.opts = optionsFor(qz, q), g.optsFor = q.id, g.opts);
  const lamps = inRound.map(x => { const k = g.order.indexOf(x); return `<i class="${k < g.i ? "done" : k === g.i ? "cur" : ""}"></i>`; }).join("");
  const textQ = q.source === "none";
  // каркас строим один раз на вопрос, чтобы не перезагружать плеер Яндекса
  if (g.skeletonFor !== q.id || !$("#stage")) {
    g.skeletonFor = q.id;
    app.innerHTML = `
    <div class="board" id="boardBox"></div>
    <section class="stage" id="stage">
      <div id="promptBox"></div>
      <div class="disc" id="disc" ${textQ ? "hidden" : ""}></div>
      ${q.source === "yandex" ? ymMarkup(ymSrc(q.ref), "ym") : ""}
      <div class="row" style="justify-content:center" id="controls"></div>
      <div class="timer" id="timer"><i id="bar"></i></div>
      <div class="tnum" id="tnum"></div>
      <div id="ansBox"></div>
      <div class="opts" id="opts"></div>
      <div id="teamsBox" style="width:100%"></div>
    </section>`;
  }
  $("#boardBox").innerHTML = `
    <div class="stack" style="gap:8px"><span class="label">${esc(R.title || "Раунд " + roundNo)} · вопрос ${inRound.indexOf(q) + 1} из ${inRound.length}</span><div class="lamps">${lamps}</div></div>
    ${g.mode === "solo" ? `<div style="text-align:right"><span class="label">Очки</span><div class="score">${g.score}</div></div>` : ""}`;
  $("#promptBox").innerHTML = textQ && g.phase === "ready" ? `<span class="label">Вопрос без музыки</span>`
    : q.prompt ? `<h2 class="prompt">${esc(q.prompt)}</h2>` : `<span class="label">${esc(questionText(q))}</span>`;
  $("#disc").innerHTML = g.phase === "reveal" && q.cover ? `<img src="${esc(q.cover)}" alt="">` : "";
  $("#disc").classList.toggle("revealed", g.phase === "reveal" && !!q.cover);
  if ($("#ym")) {
    bindYm($("#ym"));
    $("#ym").hidden = g.phase === "ready";
    const w = $("#ym .ymwrap");
    if (g.phase === "reveal") w.classList.remove("masked", "adjust");
    else if (g.ymPhase !== g.phase) w.classList.add("masked"); // при новой фазе снова размываем
    g.ymPhase = g.phase;
    $("#ym").syncYm?.();
  }
  $("#timer").hidden = g.phase === "ready";
  ["#ansBox", "#opts", "#teamsBox", "#tnum"].forEach(s => $(s).innerHTML = "");
  const controls = $("#controls");
  const playable = !textQ && q.source !== "yandex";

  if (g.phase === "ready") {
    controls.innerHTML = textQ ? `<button class="btn gold" id="go">Показать вопрос</button>` : `<button class="btn gold playbtn" id="go" aria-label="Слушать">▶</button>`;
    $("#tnum").textContent = textQ ? `${R.timer} секунд на ответ` : q.source === "yandex" ? "Нажмите, затем запустите трек в плеере Яндекса" : `Звучит ${R.fragment} секунд`;
    $("#go").onclick = startRound;
  } else if (g.phase === "listen") {
    let html = playable ? `<button class="btn" id="again">↻ Ещё раз</button>` : "";
    if (q.source === "yandex") {
      html = `<a class="btn ghost" href="${esc(ymPage(q.ref))}" target="_blank" rel="noopener" title="Если плеер не играет — включите трек в Яндекс Музыке на другом устройстве">Открыть в Яндексе ↗</a>`;
      $("#tnum").dataset.hint = "1";
    }
    if (g.mode === "host" || !opts) html += `<button class="btn gold" id="reveal">Показать ответ</button>`;
    controls.innerHTML = html;
    $("#again") && ($("#again").onclick = () => replay(q));
    $("#reveal") && ($("#reveal").onclick = () => reveal(null));
    if (!textQ) $("#disc").classList.toggle("spin", !audio.paused || q.source === "yandex");
  } else if (g.phase === "reveal") {
    const nextQ = g.order[g.i + 1];
    const nextLabel = !nextQ ? "Итоги" : nextQ.round !== q.round ? "Следующий раунд →" : "Дальше →";
    controls.innerHTML = playable ? `<button class="btn" id="full">▶ Дослушать</button>` : "";
    controls.innerHTML += `<button class="btn gold" id="next">${nextLabel}</button>`;
    $("#full") && ($("#full").onclick = () => replay(q, 30));
    $("#next").onclick = () => {
      stopAudio(); g.i++; g.picked = null; g.opts = null;
      g.phase = g.i < g.order.length && g.order[g.i].round !== q.round ? "intro" : "ready";
      render();
    };
    const custom = isCustomQ(q);
    const big = custom ? q.answer : q.title;
    const sub = custom ? [q.artist, q.title].filter(Boolean).join(" — ") : q.artist;
    $("#ansBox").innerHTML = `<div class="answer">
      ${g.mode === "solo" ? `<div class="verdict ${g.picked === answerOf(q) ? "ok" : "no"}">${g.picked === answerOf(q) ? `ВЕРНО! +${g.lastPts}` : g.picked == null ? "ВРЕМЯ ВЫШЛО" : "МИМО"}</div>` : ""}
      <div class="big">${esc(big || "")}</div>${sub ? `<div class="muted">${esc(sub)}</div>` : ""}
      ${q.note ? `<p class="hint" style="max-width:52ch;margin:6px auto 0">${esc(q.note)}</p>` : ""}</div>`;
  }

  // варианты
  const optBox = $("#opts");
  if (opts && g.phase !== "ready") {
    optBox.innerHTML = opts.map((o, k) => `<button class="opt" data-o="${esc(o)}"><kbd>${k + 1}</kbd><span>${esc(o)}</span></button>`).join("");
    optBox.querySelectorAll(".opt").forEach(b => {
      if (g.phase === "reveal") {
        b.disabled = true;
        if (b.dataset.o === answerOf(q)) b.classList.add("right");
        else if (b.dataset.o === g.picked) b.classList.add("wrong");
      } else if (g.mode === "solo") b.onclick = () => reveal(b.dataset.o);
      else b.disabled = true;
    });
  } else if (!opts && g.mode === "solo" && g.phase === "listen") {
    $("#ansBox").innerHTML = `<p class="hint">Вариантов у этого вопроса нет — ответьте вслух и откройте ответ.</p>`;
  }
  if (!opts && g.mode === "solo" && g.phase === "reveal") {
    const v = $("#ansBox .verdict");
    if (v) v.outerHTML = g.selfMarked ? `<div class="verdict ok">ЗАСЧИТАНО +${100 * R.points}</div>`
      : `<div class="row" style="justify-content:center"><button class="btn" id="selfOk" style="border-color:var(--ok)">Я угадал</button><button class="btn" id="selfNo">Не угадал</button></div>`;
    if ($("#selfOk")) $("#selfOk").onclick = () => { g.score += 100 * R.points; g.correct++; g.selfMarked = true; render(); };
    if ($("#selfNo")) $("#selfNo").onclick = () => { $("#selfNo").parentElement.remove(); };
  }

  // команды
  if (g.mode === "host" && g.phase !== "ready") {
    const p = R.points || 1;
    $("#teamsBox").innerHTML = `<div class="teams">${g.teams.map((t, k) => `
      <div class="team"><b>${esc(t.name)}</b><div class="pts">${t.pts}</div>
      <div class="row"><button class="btn icon" data-t="${k}" data-d="${-p}" aria-label="Минус ${p}">−${p > 1 ? p : ""}</button><button class="btn icon gold" data-t="${k}" data-d="${p}" aria-label="Плюс ${p}">+${p > 1 ? p : ""}</button></div></div>`).join("")}</div>`;
    $("#teamsBox").querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
      const t = g.teams[+b.dataset.t]; t.pts += +b.dataset.d;
      b.closest(".team").querySelector(".pts").textContent = t.pts;
    });
  }

  // таймер
  if (g.phase === "listen") {
    const update = () => {
      const left = Math.max(0, g.deadline - Date.now());
      const bar = $("#bar"); if (!bar) return;
      bar.style.transform = `scaleX(${left / (R.timer * 1000)})`;
      $("#tnum").textContent = Math.ceil(left / 1000) + " с" + ($("#tnum").dataset.hint ? " · нажмите ▶ в плеере Яндекса" : "");
      if (left <= 0) { clearInterval(g.tick); if (g.mode === "solo") reveal(null); else $("#tnum").textContent = "Время вышло"; }
    };
    clearInterval(g.tick); g.tick = setInterval(update, 100); update();
  }
  if (g.mode === "solo" && g.phase === "listen") {
    document.onkeydown = e => { const n = +e.key; if (n >= 1 && n <= (opts?.length || 0)) reveal(opts[n - 1]); };
  } else document.onkeydown = null;
}

async function startRound() {
  const g = state.game, q = g.order[g.i], R = roundOf(g.quiz, q);
  $("#go").disabled = true;
  if (q.source === "yandex" || q.source === "none") { g.phase = "listen"; g.deadline = Date.now() + R.timer * 1000; render(); return; }
  $("#tnum").textContent = "Загружаем трек…";
  try {
    g.src = await SOURCES[q.source].resolve(q);
    await playFragment(g.src, q.start || 0, R.fragment);
    g.phase = "listen"; g.deadline = Date.now() + R.timer * 1000;
    audio.onpause = () => $("#disc")?.classList.remove("spin");
    render();
  } catch (err) {
    $("#tnum").textContent = err.message;
    $("#controls").innerHTML = `<button class="btn gold" id="go">Попробовать снова</button><button class="btn ghost" id="skip">Пропустить вопрос</button>`;
    $("#go").onclick = startRound;
    $("#skip").onclick = () => {
      g.order.splice(g.i, 1); g.opts = null;
      g.phase = g.i < g.order.length && g.i > 0 && g.order[g.i].round !== g.order[g.i - 1].round ? "intro" : "ready";
      render();
    };
  }
}
function replay(q, len) {
  const g = state.game;
  if (!g.src) return;
  playFragment(g.src, q.start || 0, len || roundOf(g.quiz, q).fragment).then(() => $("#disc")?.classList.add("spin")).catch(e => toast(e.message));
}
function reveal(picked) {
  const g = state.game, q = g.order[g.i], R = roundOf(g.quiz, q);
  if (g.phase !== "listen") return;
  clearInterval(g.tick);
  g.picked = picked; g.lastPts = 0; g.selfMarked = false;
  if (g.mode === "solo" && picked != null && picked === answerOf(q)) {
    const left = Math.max(0, g.deadline - Date.now()) / (R.timer * 1000);
    g.lastPts = (100 + Math.round(100 * left)) * (R.points || 1);
    g.score += g.lastPts; g.correct++;
  }
  g.phase = "reveal";
  render();
}

function renderFinal() {
  const g = state.game;
  stopAudio(); document.onkeydown = null;
  const app = $("#app");
  if (g.mode === "solo") {
    const total = g.order.length;
    const pct = total ? g.correct / total : 0;
    const title = pct === 1 ? "Абсолютный слух!" : pct >= .7 ? "Отличный результат" : pct >= .4 ? "Неплохо!" : "Есть куда расти";
    app.innerHTML = `<section class="stage">
      <span class="label">Итоги</span><h1>${title}</h1>
      <div class="score" style="font-size:56px">${g.score}</div>
      <p class="muted" style="margin:0">Угадано ${g.correct} из ${total}</p>
      <div class="row" style="justify-content:center"><button class="btn gold" id="again">Сыграть ещё</button><button class="btn" id="home">К квизам</button></div></section>`;
  } else {
    const sorted = g.teams.slice().sort((a, b) => b.pts - a.pts);
    app.innerHTML = `<section class="stage">
      <span class="label">Итоги</span><h1>${sorted.length > 1 && sorted[0].pts === sorted[1].pts ? "Ничья!" : "Побеждает " + esc(sorted[0].name)}</h1>
      <div class="final">${scoreLines(g)}</div>
      <div class="row" style="justify-content:center"><button class="btn gold" id="again">Сыграть ещё</button><button class="btn" id="home">К квизам</button></div></section>`;
  }
  $("#again").onclick = () => go("setup", { editId: g.quiz.id });
  $("#home").onclick = () => go("home");
}

function saveBlob(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });

const norm = s => String(s || "").toLowerCase().replace(/ё/g, "е")
  .replace(/\(.*?\)|\[.*?\]/g, " ").replace(/\b(feat|ft)\.?\s.*$/i, " ")
  .replace(/[^\p{L}\d]+/gu, " ").trim();

function parseCSV(text) {
  const first = text.split(/\r?\n/)[0];
  const delim = [",", ";", "\t"].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()));
}

// разбирает текст списка: CSV из сервисов переноса, «Исполнитель — Название» построчно
// или текст, скопированный со страницы плейлиста (блоки, разделённые длительностью 3:45)
function parseTrackList(text) {
  text = text.replace(/ /g, " ").trim();
  if (!text) return [];
  const firstLine = text.split(/\r?\n/)[0].toLowerCase();
  if (/(track|title|song|назван|трек)/.test(firstLine) && /(artist|исполн|артист)/.test(firstLine) && /[,;\t]/.test(firstLine)) {
    const rows = parseCSV(text), head = rows.shift().map(h => h.toLowerCase());
    const ti = head.findIndex(h => /track ?name|^title|song|назван|^трек/.test(h));
    const ai = head.findIndex(h => /artist|исполн|артист/.test(h));
    if (ti >= 0 && ai >= 0) return rows.map(r => ({ artist: (r[ai] || "").trim(), title: (r[ti] || "").trim() })).filter(t => t.title);
  }
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean)
    .map(l => l.replace(/^\d{1,4}[.)]\s+/, ""));
  const SEP = /\s+[—–-]\s+/;
  const withSep = lines.filter(l => SEP.test(l)).length;
  const DUR = /^\d{1,2}:\d{2}(:\d{2})?$/;
  const durs = lines.filter(l => DUR.test(l)).length;
  if (withSep >= lines.length * 0.5) {
    return lines.filter(l => SEP.test(l)).map(l => { const [a, ...t] = l.split(SEP); return { artist: a.trim(), title: t.join(" - ").trim() }; });
  }
  if (durs >= 2) {
    const out = []; let chunk = [];
    const junk = /^(\d+|e|explicit|18\+|plus|hq|lossless|•|·)$/i;
    for (const l of lines) {
      if (DUR.test(l)) {
        const c = chunk.filter(x => !junk.test(x));
        if (c.length) out.push({ title: c[0], artist: (c[1] || "").replace(/\s*,\s*/g, ", ") });
        chunk = [];
      } else chunk.push(l);
    }
    return out;
  }
  return lines.map(l => ({ artist: "", title: l }));
}

// ссылки, которые можно загрузить напрямую
async function loadPlaylistUrl(url) {
  let m = url.match(/deezer\.com\/(?:[a-z]{2}\/)?(playlist|album)\/(\d+)/i);
  if (m) {
    const d = await jsonp(`https://api.deezer.com/${m[1]}/${m[2]}?output=jsonp`);
    if (d.error) throw new Error("Deezer: " + (d.error.message || "плейлист недоступен") + ". Плейлист должен быть публичным.");
    let tracks = (d.tracks?.data || []);
    let next = d.tracks?.next;
    while (next && tracks.length < 1000) {
      const n = await jsonp(next.replace(/output=\w+&?/, "") + (next.includes("?") ? "&" : "?") + "output=jsonp");
      tracks = tracks.concat(n.data || []); next = n.next;
    }
    return { name: d.title, tracks: tracks.filter(t => t.readable !== false).map(t => ({
      source: "deezer", ref: String(t.id), artist: t.artist?.name, title: t.title, cover: t.album?.cover_medium || d.cover_medium || "", explicit: !!t.explicit_lyrics })) };
  }
  m = url.match(/music\.apple\.com\/([a-z]{2})\/album\/[^/]*\/?(\d+)/i) || url.match(/music\.apple\.com\/([a-z]{2})\/album\/(\d+)/i);
  if (m) {
    const d = await jsonp(`https://itunes.apple.com/lookup?id=${m[2]}&entity=song&country=${m[1].toUpperCase()}`);
    const songs = (d.results || []).filter(r => r.wrapperType === "track" && r.previewUrl);
    if (!songs.length) throw new Error("Apple не отдал треки этого альбома");
    return { name: d.results[0]?.collectionName, tracks: songs.map(r => ({
      source: "itunes", ref: String(r.trackId), country: m[1].toUpperCase(), artist: r.artistName, title: r.trackName,
      cover: (r.artworkUrl100 || "").replace("100x100", "300x300"), explicit: r.trackExplicitness === "explicit" })) };
  }
  return null;
}
function playlistHint(url) {

function pickBest(want, found) {
  const wt = norm(want.title), wa = norm(want.artist);
  let best = null, bs = 0;
  for (const f of found) {
    const ft = norm(f.title), fa = norm(f.artist);
    let s = 0;
    if (ft === wt) s += 3; else if (ft && wt && (ft.includes(wt) || wt.includes(ft))) s += 2;
    if (wa) { const a1 = wa.split(" ")[0]; if (fa === wa) s += 3; else if (fa.includes(a1) || wa.includes(fa)) s += 2; }
    else s += 1;
    if (s > bs) { bs = s; best = f; }
  }
  return bs >= 3 ? best : null;
}

const W = "(?:^|[^а-яёa-z])"; // начало слова

function maskWord(w) { return w.length <= 2 ? w[0] + "*" : w[0] + "*".repeat(Math.min(w.length - 1, 5)); }
// возвращает [{cat, words}] — найденные категории и слова
function scanText(text, cats) {
  const out = [];
  if (!text) return out;
  for (const c of cats) {
    const def = CATS[c]; if (!def) continue;
    const found = new Set();
    for (const rx of def.rx) for (const m of text.matchAll(rx)) {
      const w = m[0].toLowerCase().replace(/^[^а-яёa-z*#]+/i, "");
      if (w) found.add(def.mask ? maskWord(w) : w);
    }
    if (found.size) out.push({ cat: c, words: [...found] });
  }
  return out;
}

const lyricsCache = new Map();
async function fetchLyrics(t) {
  const key = norm(t.artist) + "|" + norm(t.title);
  if (lyricsCache.has(key)) return lyricsCache.get(key);
  const res = await fetchLyricsRaw(t);
  lyricsCache.set(key, res);
  return res;
}
async function fetchLyricsRaw(t) {
  const pick = arr => {
    const ok = (arr || []).filter(x => x.plainLyrics || x.instrumental);
    const best = pickBest(t, ok.map(x => ({ artist: x.artistName, title: x.trackName, x })));
    return best ? best.x : null;
  };
  const get = async u => { const r = await fetch(u); if (!r.ok) throw new Error("lrclib " + r.status); return r.json(); };
  let hit = null;
  if (t.artist) hit = pick(await get(`https://lrclib.net/api/search?track_name=${encodeURIComponent(t.title)}&artist_name=${encodeURIComponent(t.artist)}`));
  if (!hit) hit = pick(await get(`https://lrclib.net/api/search?q=${encodeURIComponent([t.artist, t.title].filter(Boolean).join(" "))}`));
  return hit;
}
// пометка Explicit из каталога для уже сохранённых треков
async function catalogExplicit(q) {
  if (typeof q.explicit === "boolean") return q.explicit;
  try {
    if (q.source === "itunes" && q.ref) {
      const d = await jsonp(`https://itunes.apple.com/lookup?id=${q.ref}&country=${q.country || "US"}`);
      const r = d.results && d.results[0]; if (r) return r.trackExplicitness === "explicit";
    }
    if (q.source === "deezer" && q.ref) {
      const d = await jsonp(`https://api.deezer.com/track/${q.ref}?output=jsonp`);
      if (!d.error) return !!d.explicit_lyrics;
    }
  } catch {}
  return undefined;
}
// результат: status clean | explicit | unknown, reasons — пояснения, cats — найденные категории
async function checkTrack(q, cats) {
  if (!Array.isArray(cats)) cats = [];
  const reasons = [], hit = [];
  if (cats.some(c => c === "mat" || c === "rude" || c === "sex")) {
    const exp = await catalogExplicit(q);
    if (typeof exp === "boolean") q.explicit = exp;
    if (exp) { reasons.push(`помечена как Explicit в ${q.source === "deezer" ? "Deezer" : "Apple Music"}`); hit.push("explicit"); }
  }
  let lyricsChecked = false;
  try {
    const l = await fetchLyrics(q);
    if (l) {
      lyricsChecked = true;
      for (const h of scanText(l.plainLyrics || "", cats)) {
        reasons.push(`${CATS[h.cat].label.toLowerCase()}: ${h.words.slice(0, 4).join(", ")}`);
        hit.push(h.cat);
      }
    }
  } catch { /* сервис текстов не ответил */ }
  // каталоги часто не ставят Explicit русским трекам, поэтому «чисто» — только после проверки текста
  const status = reasons.length ? "explicit" : lyricsChecked ? "clean" : "unknown";
  if (status === "unknown") reasons.push("текст песни не найден");
  return (q.mat = { status, reasons, cats: hit, at: Date.now() });
}
async function pool(items, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; await fn(items[k], k); } }));
}

        <summary style="cursor:pointer;color:var(--fg);font-weight:600">Как перенести плейлист из Яндекс Музыки, Spotify, VK или Звука</summary>
        <div class="stack" style="gap:8px;margin-top:10px">
          <p class="hint"><b>Скопировать со страницы.</b> Откройте плейлист в браузере на компьютере и прокрутите его до конца, чтобы подгрузились все треки. Выделите список мышью от первого трека до последнего, скопируйте и вставьте сюда. Мелодика сама найдёт названия и исполнителей. Проверьте результат в поле выше.</p>
          <p class="hint"><b>Через сервис переноса.</b> <a href="https://www.tunemymusic.com" target="_blank" rel="noopener">TuneMyMusic</a> и <a href="https://soundiiz.com" target="_blank" rel="noopener">Soundiiz</a> умеют выгружать плейлисты Яндекс Музыки, Spotify, VK и других в файл CSV или TXT. Загрузите этот файл кнопкой выше.</p>
          <p class="hint"><b>Вручную.</b> Каждая строка — «Исполнитель — Название».</p>
        </div>
      </details>
    </section>

    <section class="card stack" id="plStep2" hidden>
      <h2>2. Настройка квиза</h2>
      <p class="hint" id="plCount"></p>
      <div class="settings">
        <label class="field" style="grid-column:1/-1"><span class="label">${target ? "Название нового раунда" : "Название квиза"}</span><input type="text" id="plName"></label>
        <label class="field"><span class="label">Сколько вопросов</span>
          <select id="plN"><option value="0">Все треки</option>${[5,10,15,20,30,50].map(n => `<option value="${n}" ${n === 10 ? "selected" : ""}>${n} случайных</option>`).join("")}</select></label>
        <label class="field"><span class="label">Что угадывать</span>
          <select id="plAsk">${Object.entries(ASK).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}<option value="mix">Вперемешку</option></select></label>
        <label class="field"><span class="label">Где искать звук</span>
          <select id="plSrc"><option value="deezer,itunes">Deezer, затем Apple</option><option value="itunes,deezer">Apple, затем Deezer</option><option value="itunes">Только Apple</option><option value="deezer">Только Deezer</option></select></label>
        <label class="field"><span class="label">Страна для Apple</span>
          <select id="plCountry">${["US","RU","FI","DE","GB","KZ","UA"].map(c => `<option ${c === (localStorageGet("melodika.country") || "US") ? "selected" : ""}>${c}</option>`).join("")}</select></label>
        <div class="field" style="grid-column:1/-1"><span class="label">Убрать песни, где есть</span>
          <div class="chips" id="plCats">${Object.entries(CATS).map(([k, c]) => `<label class="chip"><input type="checkbox" data-c="${k}" ${(target?.filter || []).includes(k) ? "checked" : ""}> ${c.label}</label>`).join("")}</div></div>
      </div>
      <label class="row" style="gap:8px" id="plStrictRow"><input type="checkbox" id="plStrict"> Убирать и те песни, текст которых не удалось найти</label>
      <p class="hint" id="plCleanHint">Тексты песен проверяются через открытую базу LRCLIB, плюс учитывается пометка Explicit в каталогах. Такие песни не попадут в квиз, а в конце вы увидите, какие удалены и почему.</p>
      <div class="row"><button class="btn gold" id="plBuild">Собрать квиз</button></div>
      <div id="plProgress" class="stack" style="gap:8px"></div>
    </section>
  </div>`;
  $("#topActions").innerHTML = `<button class="btn sm ghost" id="plBack">${target ? "К редактору" : "Назад"}</button>`;
  $("#plBack").onclick = () => target ? go("edit", { editId: target.id }) : go("home");

  let parsed = [];
  const showParsed = list => {
    parsed = list;
    $("#plStep2").hidden = !list.length;
    if (!list.length) return toast("Не нашли в списке ни одного трека");
    $("#plText").value = pl.text = list.map(t => t.artist ? `${t.artist} — ${t.title}` : t.title).join("\n");
    $("#plCount").textContent = `Найдено ${list.length} ${plural(list.length, "трек", "трека", "треков")}. Если что-то разобралось неверно, поправьте список и нажмите «Разобрать» ещё раз.`;
    if ($("#plName") && !$("#plName").value) $("#plName").value = pl.name || (target ? `Раунд ${target.rounds.length + 1}` : "Мой плейлист");
  };
  const plCats = () => [...document.querySelectorAll("#plCats [data-c]:checked")].map(x => x.dataset.c);
  const syncClean = () => { const off = !plCats().length; $("#plStrictRow").hidden = off; $("#plCleanHint").hidden = off; };
  document.querySelectorAll("#plCats [data-c]").forEach(x => x.onchange = syncClean); syncClean();
  $("#plText").oninput = e => pl.text = e.target.value;
  $("#plParse").onclick = () => { pl.direct = {}; showParsed(parseTrackList($("#plText").value)); };
  $("#plSwap").onclick = () => { showParsed(parseTrackList($("#plText").value).map(t => ({ artist: t.title, title: t.artist })).filter(t => t.title)); };
  $("#plFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    pl.name = f.name.replace(/\.[^.]+$/, "");
    pl.direct = {};
    showParsed(parseTrackList(await f.text()));
    e.target.value = "";
  };
  $("#plUrlForm").onsubmit = async e => {
    e.preventDefault();
    const url = $("#plUrl").value.trim(); if (!url) return;
    const msg = $("#plUrlMsg");
    msg.innerHTML = `<p class="hint">Загружаем…</p>`;
    try {
      const r = await loadPlaylistUrl(url);
      if (!r) { msg.innerHTML = `<div class="note">${esc(playlistHint(url))} Скопируйте список треков со страницы плейлиста и вставьте его в поле ниже — подсказка под полем.</div>`; return; }
      pl.name = r.name || ""; pl.direct = {};
      r.tracks.forEach(t => pl.direct[norm(t.artist) + "|" + norm(t.title)] = t);
      msg.innerHTML = `<p class="hint" style="color:var(--ok)">Загружено: «${esc(r.name || "плейлист")}», ${r.tracks.length} ${plural(r.tracks.length, "трек", "трека", "треков")}.</p>`;
      if ($("#plName")) $("#plName").value = r.name || "";
      showParsed(r.tracks);
      pl.direct = {}; r.tracks.forEach(t => pl.direct[norm(t.artist) + "|" + norm(t.title)] = t);
    } catch (err) { msg.innerHTML = `<p class="hint" style="color:var(--bad)">${esc(err.message)}</p>`; }
  };

  $("#plBuild").onclick = async () => {
    // список могли поправить руками — берём актуальный
    const list = parseTrackList($("#plText").value);
    if (!list.length) return toast("Список пуст");
    const n = +$("#plN").value, askSel = $("#plAsk").value;
    const order = $("#plSrc").value.split(","), country = $("#plCountry").value;
    localStorageSet("melodika.country", country);
    const cats = plCats(), strict = $("#plStrict").checked;
    const pool = shuffle(list);
    const want = n ? Math.min(n, list.length) : list.length;
    const prog = $("#plProgress");
    prog.innerHTML = `<div class="timer"><i id="plBar" style="transform:scaleX(0)"></i></div><p class="hint" id="plStatus">Ищем звук для треков…</p>`;
    $("#plBuild").disabled = true;
    const found = [], missed = [], removed = [];
    let idx = 0, checked = 0;
    const askFor = i => askSel === "mix" ? ["track", "artist", "title"][i % 3] : askSel;
    async function worker() {
      while (found.length < want && idx < pool.length) {
        const t = pool[idx++];
        let hit = pl.direct[norm(t.artist) + "|" + norm(t.title)] || null;
        for (const src of order) {
          if (hit) break;
          try {
            const res = await SOURCES[src].search(`${t.artist} ${t.title}`.trim(), country);
            const b = pickBest(t, res);
            if (b) { const { preview, ...rest } = b; hit = rest; }
          } catch { /* источник не ответил — пробуем следующий */ }
        }
        checked++;
        if (hit && cats.length && found.length < want) {
          const cand = { ...hit, artist: t.artist || hit.artist, title: t.title || hit.title };
          $("#plStatus") && ($("#plStatus").textContent = `Проверяем текст: ${cand.artist} — ${cand.title}`);
          const r = await checkTrack(cand, cats);
          if (r.status === "explicit" || (strict && r.status === "unknown")) { removed.push(cand); hit = null; t.skip = true; }
          else hit = cand;
        }
        if (hit && found.length < want) found.push({ ...hit, artist: t.artist || hit.artist, title: t.title || hit.title });
        else if (!hit && !t.skip) missed.push(t);
        $("#plBar") && ($("#plBar").style.transform = `scaleX(${Math.min(1, found.length / want)})`);
        $("#plStatus") && ($("#plStatus").textContent = `Найдено ${found.length} из ${want} · проверено ${checked}`);
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);
    $("#plBuild").disabled = false;
    if (!found.length) {
      prog.innerHTML = `<div class="note">Ни один трек не нашёлся в каталогах. Проверьте, что в строках есть и исполнитель, и название, или попробуйте другую страну для Apple.</div>`;
      return;
    }
    const questions = found.map((t, i) => ({ id: uid(), start: 0, ...t, ask: askFor(i) }));
    let qz = target;
    const name = ($("#plName")?.value || "").trim();
    if (qz) {
      const r = newRound(qz, name || undefined); qz.rounds.push(r); activeRound[qz.id] = r.id;
      questions.forEach(q => q.round = r.id); qz.questions.push(...questions);
      if (cats.length) qz.filter = [...new Set([...(qz.filter || []), ...cats])];
    }
    else {
      qz = ensureRounds({ id: uid(), title: name || "Квиз из плейлиста", fragment: 15, timer: 20, created: Date.now(), questions, filter: cats });
      state.quizzes.unshift(qz);
    }
    saveQuizzes();
    pl = { text: "", direct: {}, name: "" };
    prog.innerHTML = `
      <p style="margin:0;color:var(--ok);font-weight:600">Готово: ${found.length} ${plural(found.length, "вопрос", "вопроса", "вопросов")} в квизе «${esc(qz.title)}».</p>
      ${found.length < want ? `<p class="hint">В плейлисте не хватило подходящих песен до ${want}.</p>` : ""}
      ${removed.length ? `<div class="note" style="border-left-color:var(--bad)"><b style="color:var(--fg)">Удалили ${removed.length} ${plural(removed.length, "песню", "песни", "песен")} из-за запрещённого содержания:</b><div class="stack" style="gap:4px;margin-top:8px;font-size:14px">${removed.map(t => matLine(t)).join("")}</div></div>` : (cats.length ? `<p class="hint">Ничего запрещённого не нашли — все песни прошли проверку.</p>` : "")}
      ${missed.length ? `<details class="note"><summary style="cursor:pointer">Не нашлись в каталогах: ${missed.length}</summary><p class="hint" style="margin-top:8px">${missed.slice(0, 60).map(t => esc([t.artist, t.title].filter(Boolean).join(" — "))).join("<br>")}${missed.length > 60 ? "<br>…" : ""}</p></details>` : ""}
      <div class="row"><button class="btn gold" id="plPlay">Играть</button><button class="btn" id="plEdit">Открыть в редакторе</button></div>`;
    $("#plPlay").onclick = () => go("setup", { editId: qz.id });
    $("#plEdit").onclick = () => go("edit", { editId: qz.id });
  };
  if (pl.text) showParsed(parseTrackList(pl.text));
}

/* ================= старт ================= */
function checkHash() {
  const m = location.hash.match(/^#quiz=([\w-]+)/);
  if (!m) return false;
  try { importQuiz(decodeQuiz(m[1])); } catch { toast("Ссылка на квиз повреждена"); }
  history.replaceState(null, "", location.pathname + location.search);
  return true;
}
window.addEventListener("hashchange", checkHash);
(async () => { if (!checkHash() && !(await loadPreset().catch(() => false))) render(); })();
</script>
</body>
</html>
